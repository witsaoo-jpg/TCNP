<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>บันทึกที่ยกเลิก | ENR V3</title>
  <link rel="stylesheet" href="assets/css/base.css">

<body class="notes-page cancelled-page">
  <nav class="enr-topbar">
    <div class="enr-topbar__title">🚫 บันทึกที่ยกเลิก</div>
    <div class="enr-topbar__actions">
      <span class="enr-topbar__user">👤 <span id="noteUser">...</span></span>
      <button class="enr-btn enr-btn--soft" id="backNotesBtn">← กลับประวัติหลัก</button>
    </div>
  </nav>

  <section class="enr-patient-banner" id="patientBanner"></section>

      </div>

        <button class="enr-btn" id="backNotesBtn2">← ประวัติหลัก</button>

    <section class="note-list" id="cancelledList"></section>
  </main>

  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/enr-core.js"></script>
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/pages/nursing-notes-cancelled.js"></script>
