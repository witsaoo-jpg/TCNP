name: Publish temporary presentation demo
on:
  push:
    branches:
      - chore/github-clean-frontend-v3
    paths:
      - 'demo/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-demo
  cancel-in-progress: true
jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload DEMO directory ONLY
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo
      - name: Deploy presentation demo
        id: deployment
        uses: actions/deploy-pages@v4
